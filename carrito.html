<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Sonido Vivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <h1>Sonido Vivo</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html" id="contador-carrito">Carrito (0)</a>
        </nav>
        <div class="acceso-usuarios">
            <a href="login.html">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
        </div>
    </header>

    <!-- MAIN: Detalle del Carrito -->
    <main style="padding: 40px; min-height: 60vh;">
        <h2 style="margin-bottom: 20px; color: #1d3557;">Tu Carrito de Compras</h2>
        
        <table class="tabla-admin" id="tabla-carrito">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="cuerpo-carrito"> 
            </tbody>
        </table>

        <div style="text-align: right; margin-top: 20px;">
            <h3 id="total-carrito" style="margin-bottom: 15px;">Total: $0</h3>
            <button style="padding: 15px 30px; background-color: #2a9d8f; color: white; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px;">Proceder al Pago</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-info">
            <p><strong>Sonido Vivo - Viña del Mar</strong></p>
        </div>
    </footer>

    <script src="validaciones.js"></script>

</body>
</html>
