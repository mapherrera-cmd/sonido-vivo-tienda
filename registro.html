<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sonido Vivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- HEADER: El mismo de las vistas públicas -->
    <header>
        <div class="logo">
            <h1>Sonido Vivo</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">🛒 Carrito (0)</a>
        </nav>
        <div class="acceso-usuarios">
            <a href="login.html">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
        </div>
    </header>

    <main class="contenedor-formulario">
        <section class="caja-registro">
            <h2>Crea tu cuenta en Sonido Vivo</h2>
            <p>Únete para comprar instrumentos y revisar tu historial.</p>
            
            <!-- FORMULARIO DE REGISTRO -->
            <form id="form-registro" action="#" method="POST">
                
                <div class="grupo-input">
                    <label for="run">RUN (Sin puntos ni guion):</label>
                    <input type="text" id="run" placeholder="Ej: 19011022K" required>
                    <span id="error-run" class="mensaje-error"></span>
                </div>

                <div class="grupo-input">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" placeholder="ejemplo@gmail.com o @duoc.cl" required>
                    <span id="error-correo" class="mensaje-error"></span>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña (4 a 10 caracteres):</label>
                    <input type="password" id="password" required>
                    <span id="error-password" class="mensaje-error"></span>
                </div>

                <!-- SELECTS PARA REGIÓN Y COMUNA (Pablo usará JS aquí) -->
                <div class="grupo-input">
                    <label for="region">Región:</label>
                    <select id="region" required>
                        <option value="">-- Selecciona una Región --</option>
                        <!-- Las opciones reales las inyectará Pablo con JS -->
                        <option value="valparaiso">Valparaíso</option>
                        <option value="metropolitana">Metropolitana</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="comuna">Comuna:</label>
                    <select id="comuna" required>
                        <option value="">-- Selecciona primero una Región --</option>
                        <!-- Las comunas aparecerán solas con JS -->
                    </select>
                </div>

                <button type="submit" class="btn-formulario">Registrarme</button>
            </form>
            <p class="enlace-alternativo">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-info">
            <p><strong>Sonido Vivo - Viña del Mar</strong></p>
        </div>
    </footer>

    <!-- Aquí conectaremos el archivo JS de Pablo más adelante -->
    <!-- <script src="validaciones.js"></script> -->
     <script src="validaciones.js"></script>
</body>

</html>
